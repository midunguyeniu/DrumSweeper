<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2218"/>
      <stop offset="1" stop-color="#150d0a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe3b0"/>
      <stop offset="1" stop-color="#e8b36a"/>
    </linearGradient>
  </defs>

  <!-- nền -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- trống xanh (trái) -->
  <g>
    <path d="M60 330 V420 A95 36 0 0 0 250 420 V330 Z" fill="#17808f"/>
    <path d="M60 330 V352 A95 36 0 0 0 250 352 V330 Z" fill="#1fb8c9"/>
    <ellipse cx="155" cy="330" rx="95" ry="36" fill="#4bd0ff"/>
    <ellipse cx="155" cy="330" rx="62" ry="22" fill="#eafcff"/>
  </g>

  <!-- trống đỏ (phải) -->
  <g>
    <path d="M262 330 V420 A95 36 0 0 0 452 420 V330 Z" fill="#b83a1c"/>
    <path d="M262 330 V352 A95 36 0 0 0 452 352 V330 Z" fill="#e0542e"/>
    <ellipse cx="357" cy="330" rx="95" ry="36" fill="#ff6a4a"/>
    <ellipse cx="357" cy="330" rx="62" ry="22" fill="#fff2ea"/>
  </g>

  <!-- 2 dùi trống, đầu dùi chạm mặt trống -->
  <g>
    <path d="M81.6 74.2 L58.4 85.8 L184.6 324.7 L195.4 319.3 Z" fill="url(#wood)" stroke="#7a4a1c" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="190" cy="322" r="11" fill="#ffcc33" stroke="#a24a08" stroke-width="4"/>
  </g>
  <g transform="translate(512 0) scale(-1 1)">
    <path d="M81.6 74.2 L58.4 85.8 L184.6 324.7 L195.4 319.3 Z" fill="url(#wood)" stroke="#7a4a1c" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="190" cy="322" r="11" fill="#ffcc33" stroke="#a24a08" stroke-width="4"/>
  </g>
</svg>
